functionsDirectory = "netlify/functions"
functionsDirectoryOrigin = "default"
plugins = []

# Google indexed the extensionless "pretty" URLs on its own (e.g. /ethiopia, not
# /ethiopia.html) and ignored our declared canonical -- Netlify was serving both
# forms with no redirect, a duplicate-content signal that was stalling indexing
# (Search Console: "Duplicate, Google chose different canonical than user", found
# 2026-10-18). These force a real 301 to the form Google already prefers, so the
# two URLs collapse into one instead of competing.
# Netlify redirects only support :splat from a trailing "/*" wildcard, not named
# params like ":page" extracted mid-pattern -- that earlier attempt here actually
# redirected everything to the literal, broken path "/:page" (caught and fixed
# within minutes via curl -I, 2026-10-18). Every page is listed explicitly instead;
# there are few enough that this is also just plainly easier to verify is correct.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/fullpowerdark.html"
  to = "/fullpowerdark"
  status = 301
  force = true

[[redirects]]
  from = "/rangeline.html"
  to = "/rangeline"
  status = 301
  force = true

