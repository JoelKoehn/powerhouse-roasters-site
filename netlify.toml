[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex"

[build]
publish = "."
publishOrigin = "default"
functions = "netlify/functions"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[functions]

  [functions.check-review-requests]
    schedule = "@daily"

  [functions."*"]